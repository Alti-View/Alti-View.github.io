<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" style="background:#141C24; font-family:'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Dégradé Signature Cyan / Bleu Cockpit -->
    <linearGradient id="cyanAir" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <!-- Halo lumineux du nez de l'avion -->
    <filter id="glowBeacon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Cadre conteneur cockpit -->
  <rect x="30" y="30" width="940" height="240" rx="32" fill="#18232E" stroke="#223242" stroke-width="2"/>

  <g transform="translate(65, 75)">
    <!-- Boîtier icône du logo -->
    <rect width="150" height="150" rx="36" fill="#141C24" stroke="#223242" stroke-width="2"/>
    
    <!-- Silhouette Avion-A géométrique -->
    <g transform="translate(75, 75) scale(1.35)">
      <!-- Sommet supérieur du A -->
      <polygon points="0,-42 22,0 -22,0" fill="url(#cyanAir)"/>
      <polygon points="0,-24 8,-4 -8,-4" fill="#141C24"/>
      
      <!-- Montants inférieurs du A -->
      <polygon points="-24,8 -10,8 -20,32 -34,32" fill="url(#cyanAir)"/>
      <polygon points="24,8 10,8 20,32 34,32" fill="url(#cyanAir)"/>

      <!-- L'avion blanc en traverse géométrique -->
      <path d="M 0,-34 L 3,-4 L 38,10 L 32,14 L 3,8 L 3,24 L 11,28 L 0,26 L -11,28 L -3,24 L -3,8 L -32,14 L -38,10 L -3,-4 Z" fill="#FFFFFF"/>
      <circle cx="0" cy="-34" r="2.5" fill="#00F0FF" filter="url(#glowBeacon)"/>
    </g>

    <!-- Typographie principale et slogan mis à jour -->
    <text x="185" y="78" fill="#F8FAFC" font-size="52" font-weight="900" letter-spacing="4">ALTI<tspan fill="#00F0FF" font-weight="400">VIEW</tspan></text>
    <text x="187" y="112" fill="#38BDF8" font-size="15" font-weight="700" letter-spacing="5">PREPARE<tspan fill="#64748B"> • </tspan>FLY<tspan fill="#64748B"> • </tspan>IMPROVE</text>
  </g>
</svg>
