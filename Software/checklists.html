<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALTIVIEW — Checklists Normales</title>
    <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/cockpit.css">
    <script src="assets/cockpit-nav.js"></script>
    <script src="assets/data-sources.js"></script>

    <style>
        :root {
            --bg-color: var(--canvas, #070b10);
            --border-color: var(--line, #1e293b);
            --text-color: var(--text, #f1f5f9);
            --hover-bg: var(--panel-hover, #141f2d);
            --accent-green: var(--success, #10B981);
            --accent-orange: var(--accent, #f97316);
            --accent-blue: var(--cyan, #22d3ee);
            --sidebar-highlight-hover: var(--line-strong, #334155);
            --card-bg: var(--panel, #0d1520);
            --muted-text: var(--muted, #94a3b8);
            --drag-ghost: rgba(255, 255, 255, 0.08);
        }

        [data-theme="day"], html:not(.dark-mode) {
            --bg-color: var(--canvas, #E8EDF1);
            --border-color: var(--line, #C8D2DB);
            --text-color: var(--text, #0C1620);
            --hover-bg: var(--panel-hover, #E2E8EE);
            --accent-green: var(--success, #059669);
            --accent-orange: var(--accent, #FFA94D);
            --accent-blue: var(--cyan, #0A7365);
            --sidebar-highlight-hover: var(--panel-hover, #E2E8EE);
            --card-bg: var(--panel, #F5F7F9);
            --muted-text: var(--muted, #475868);
            --drag-ghost: rgba(0, 0, 0, 0.06);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { transition: background-color 0.25s ease; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font: 400 15px/1.6 var(--f-body, 'IBM Plex Sans', system-ui, sans-serif);
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 clamp(16px, 2.5vw, 32px);
            height: var(--navh, 68px);
            border-bottom: 1px solid var(--line, #1e293b);
            background-color: var(--glass);
            backdrop-filter: blur(16px) saturate(1.2);
            -webkit-backdrop-filter: blur(16px) saturate(1.2);
            gap: 20px;
        }

        .brand { display: flex; align-items: center; gap: 15px; font-size: 24px; font-weight: 700; letter-spacing: -0.03em; }
        .brand svg { width: 40px; height: 40px; }
        .top-bar-right { display: flex; align-items: center; gap: 20px; }
        .meta-text { font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }

        .theme-toggle {
            display: flex; align-items: center; justify-content: center;
            width: 44px; height: 44px; border: 2px solid var(--border-color);
            border-radius: 50%; background-color: var(--bg-color); color: var(--text-color);
            cursor: pointer; transition: background-color 0.2s ease, transform 0.2s ease; flex-shrink: 0;
        }
        .theme-toggle:hover { background-color: var(--hover-bg); transform: scale(1.05); }
        .theme-toggle svg { width: 20px; height: 20px; stroke: var(--text-color); }
        .theme-toggle .icon-moon { display: none; }
        html.dark-mode .theme-toggle .icon-sun { display: none; }
        html.dark-mode .theme-toggle .icon-moon { display: block; }

        .main-layout { display: flex; flex: 1; }

        .sidebar { width: 260px; min-width: 260px; max-width: 260px; flex: 0 0 260px; border-right: 2px solid var(--border-color); display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar a {
            padding: 25px; text-decoration: none; color: var(--text-color); font-size: 16px; font-weight: 500;
            border-bottom: 2px solid var(--border-color); transition: background-color 0.2s ease; display: flex;
            justify-content: space-between; align-items: center; gap: 10px; white-space: nowrap;
        }
        .sidebar a::after { content: '→'; flex-shrink: 0; opacity: 0; transform: translateX(-6px); transition: opacity 0.2s ease, transform 0.2s ease; }
        .sidebar a:hover { background-color: var(--hover-bg); }
        .sidebar a:hover::after { opacity: 1; transform: translateX(0); }
        .sidebar a.highlight { background-color: var(--border-color); color: var(--bg-color); }
        .sidebar a.highlight:hover { background-color: var(--sidebar-highlight-hover); }

        .sidebar-export-wrap { padding: 25px; }
        .btn-export-bw {
            background-color: var(--text-color);
            color: var(--bg-color);
            border: 2px solid var(--text-color);
            padding: 14px 18px;
            font-size: 13px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }
        .btn-export-bw:hover {
            background-color: transparent;
            color: var(--text-color);
        }
        .btn-export-bw:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .content-section { flex: 1; padding: 50px 5vw; display: flex; flex-direction: column; gap: 35px; min-width: 0; }
        .page-heading h1 { font-size: 42px; font-weight: 700; letter-spacing: -0.03em; }
        .page-heading p { margin-top: 8px; color: var(--muted-text); font-size: 15px; }

        .workspace { display: flex; gap: 40px; flex: 1; align-items: flex-start; }

        .aircraft-panel { width: 320px; flex-shrink: 0; border: 1px solid var(--border-color); background-color: var(--card-bg); display: flex; flex-direction: column; border-radius: 18px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.25); }
        .panel-title { padding: 18px 20px; border-bottom: 1px solid var(--border-color); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .aircraft-list { list-style: none; max-height: 480px; overflow-y: auto; flex: 1; }
        .aircraft-list li {
            display: flex; justify-content: space-between; align-items: center; padding: 16px 20px;
            border-bottom: 1px solid var(--hover-bg); cursor: pointer; font-size: 15px; font-weight: 500;
            transition: background-color 0.15s ease;
        }
        .aircraft-list li:hover { background-color: var(--hover-bg); }
        .aircraft-list li.active { background-color: var(--border-color); color: var(--bg-color); }
        .aircraft-list li .count-tag { font-size: 12px; font-weight: 500; opacity: 0.65; }
        .aircraft-list li .remove-btn { background: none; border: none; color: inherit; opacity: 0.5; cursor: pointer; font-size: 16px; line-height: 1; padding: 2px 6px; transition: opacity 0.15s ease; }
        .aircraft-list li .remove-btn:hover { opacity: 1; color: var(--danger); }
        .aircraft-list li .row-main { display: flex; align-items: center; gap: 10px; overflow: hidden; }
        .aircraft-list li .row-main span.model-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .add-aircraft-form { display: flex; border-top: 1px solid var(--border-color); }
        .add-aircraft-form input { flex: 1; border: none; background: transparent; padding: 16px 20px; font-family: 'Inter', sans-serif; font-size: 14px; color: var(--text-color); outline: none; }
        .add-aircraft-form input::placeholder { color: var(--muted-text); }
        .add-aircraft-form button { border: none; border-left: 1px solid var(--border-color); background-color: var(--accent-green); color: var(--bg-color); font-weight: 700; padding: 0 22px; cursor: pointer; font-size: 18px; transition: opacity 0.15s ease; }
        .add-aircraft-form button:hover { opacity: 0.85; }

        .data-actions { display: flex; border-top: 1px solid var(--border-color); }
        .data-actions button {
            flex: 1; border: none; background: var(--bg-color); color: var(--text-color);
            padding: 12px; font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; transition: background-color 0.15s ease;
        }
        .data-actions button:first-child { border-right: 1px solid var(--border-color); }
        .data-actions button:hover { background-color: var(--hover-bg); }

        .empty-state { padding: 30px 20px; font-size: 14px; color: var(--muted-text); }

        .checklists-panel { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 18px; }

        .checklists-panel-header { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid var(--border-color); padding-bottom: 18px; gap: 20px; flex-wrap: wrap; }
        .checklists-panel-header h2 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
        .checklists-panel-header .sub { font-size: 13px; color: var(--muted-text); margin-top: 4px; }

        .new-checklist-form { display: flex; border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; }
        .new-checklist-form input { border: none; background: transparent; padding: 12px 16px; font-family: 'Inter', sans-serif; font-size: 14px; color: var(--text-color); outline: none; width: 220px; }
        .new-checklist-form input::placeholder { color: var(--muted-text); }
        .new-checklist-form button { border: none; border-left: 1px solid var(--border-color); background-color: var(--accent-orange); color: #070b10; font-weight: 700; padding: 0 20px; cursor: pointer; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; transition: opacity 0.15s ease; }
        .new-checklist-form button:hover { opacity: 0.85; }

        .flow-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
        .flow-hint { font-size: 13px; color: var(--muted-text); }
        .flow-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .ghost-btn {
            border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-color);
            font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.4px;
            text-transform: uppercase; padding: 8px 12px; cursor: pointer; border-radius: 8px;
            transition: all 0.15s ease;
        }
        .ghost-btn:hover { background-color: var(--hover-bg); }

        .checklist-flow { display: flex; flex-direction: column; gap: 12px; }

        .checklist-card {
            border: 1px solid var(--border-color); background-color: var(--card-bg);
            display: flex; flex-direction: column; transition: opacity 0.15s ease, background-color 0.15s ease;
            border-radius: 18px; overflow: hidden; box-shadow: 0 4px 18px rgba(0,0,0,0.2);
        }
        .checklist-card.dragging { opacity: 0.4; }
        .checklist-card.drag-over { border-style: dashed; background-color: var(--drag-ghost); }

        .checklist-card-header { display: flex; align-items: center; gap: 8px; padding: 10px 10px 10px 6px; }
        .checklist-card:not(.collapsed) .checklist-card-header { border-bottom: 1px solid var(--border-color); }

        .drag-handle {
            width: 28px; height: 34px; display: flex; align-items: center; justify-content: center;
            cursor: grab; color: var(--muted-text); flex-shrink: 0; user-select: none;
        }
        .drag-handle:active { cursor: grabbing; }

        .phase-index {
            font-variant-numeric: tabular-nums; font-size: 12px; font-weight: 700;
            letter-spacing: 0.08em; min-width: 26px; color: var(--muted-text);
        }

        .checklist-card-header h3 {
            flex: 1; min-width: 0; font-size: 17px; font-weight: 700;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .progress-tag { font-size: 12px; font-weight: 500; color: var(--muted-text); white-space: nowrap; }

        .header-actions { display: flex; align-items: center; gap: 1px; flex-shrink: 0; }
        .icon-btn {
            background: none; border: none; color: var(--muted-text); cursor: pointer;
            width: 28px; height: 28px; font-size: 14px; line-height: 1;
            display: inline-flex; align-items: center; justify-content: center;
            border-radius: 6px;
        }
        .icon-btn:hover { color: var(--text-color); background-color: var(--hover-bg); }
        .icon-btn.danger:hover { color: var(--danger); }
        .icon-btn:disabled { opacity: 0.28; cursor: default; background: none; }

        .checklist-body { display: flex; flex-direction: column; }
        .checklist-card.collapsed .checklist-body { display: none; }

        .checklist-items { list-style: none; padding: 6px 0; }
        .checklist-items li { display: flex; align-items: center; gap: 8px; padding: 8px 12px 8px 8px; }
        .checklist-items li.item-dragging { opacity: 0.4; }
        .checklist-items li.item-drag-over { background-color: var(--drag-ghost); }
        .checklist-items li input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent-green); flex-shrink: 0; cursor: pointer; }
        
        .checklist-items li span.item-text { font-size: 15px; word-break: break-word; flex-shrink: 0; }
        .checklist-items li span.item-leader { flex: 1; border-bottom: 2px dotted var(--muted-text); opacity: 0.35; margin: 0 10px; transform: translateY(-6px); }
        .checklist-items li span.item-value { font-size: 14px; font-weight: 700; color: var(--accent-blue); flex-shrink: 0; }
        
        .checklist-items li.checked span.item-text,
        .checklist-items li.checked span.item-value,
        .checklist-items li.checked span.item-leader { opacity: 0.5; text-decoration: line-through; color: var(--muted-text); }
        
        .checklist-items li .remove-item-btn,
        .checklist-items li .item-move-btn {
            background: none; border: none; color: var(--muted-text); cursor: pointer;
            font-size: 13px; width: 22px; height: 22px; opacity: 0;
            border-radius: 4px;
        }
        .checklist-items li:hover .remove-item-btn,
        .checklist-items li:hover .item-move-btn,
        .checklist-items li:hover .item-handle { opacity: 1; }
        .checklist-items li .remove-item-btn:hover { color: var(--danger); }
        .checklist-items li .item-move-btn:disabled { opacity: 0.2; cursor: default; }
        .checklist-items .no-items { padding: 14px 20px; font-size: 13px; color: var(--muted-text); }

        .item-handle {
            width: 18px; color: var(--muted-text); cursor: grab; opacity: 0.3;
            user-select: none; font-size: 11px; letter-spacing: -1px; text-align: center;
        }
        .item-handle:active { cursor: grabbing; }

        .add-item-form { display: flex; border-top: 2px solid var(--hover-bg); }
        .add-item-form input {
            border: none; background: transparent; padding: 13px 20px;
            font-family: 'Inter', sans-serif; font-size: 14px; color: var(--text-color); outline: none;
        }
        .add-item-form input.name-input { flex: 2; }
        .add-item-form input.val-input { flex: 1; border-left: 2px solid var(--hover-bg); font-weight: 600; }
        .add-item-form input::placeholder { color: var(--muted-text); font-weight: 400; }
        
        .add-item-form button {
            border: none; border-left: 2px solid var(--hover-bg); background: transparent;
            color: var(--text-color); font-weight: 700; padding: 0 20px; cursor: pointer; font-size: 17px;
        }
        .add-item-form button:hover { background-color: var(--hover-bg); }

        .no-aircraft-selected {
            border: 2px dashed var(--border-color); padding: 60px 30px;
            text-align: center; color: var(--muted-text); font-size: 15px;
            border-radius: 18px;
        }

        /* NEW: Editable text hover styles */
        .editable-text {
            cursor: pointer;
            transition: color 0.15s ease;
        }
        .editable-text:hover {
            color: var(--accent-blue) !important;
            text-decoration: underline;
            text-decoration-thickness: 2px;
            text-underline-offset: 3px;
        }

        /* Responsive Fixes */
        @media (max-width: 1200px) {
            .workspace { flex-direction: column; align-items: stretch; }
            .aircraft-panel { width: 100%; }
        }
        
        @media (max-width: 900px) {
            .content-section { padding: 35px 20px; }
            .new-checklist-form input { width: 100%; }
            .add-item-form { flex-direction: column; }
            .add-item-form input.val-input { border-left: none; border-top: 2px solid var(--hover-bg); }
            .add-item-form button { border-left: none; border-top: 2px solid var(--hover-bg); padding: 10px; }
        }

        #print-container { display: none; width: 100%; padding: 0; }
        #print-container.print-measuring {
            display: block; position: fixed; top: 0; left: -10000px; visibility: hidden;
        }

        .print-header { 
            text-align: center; margin-bottom: 25px; font-size: 22px; 
            font-weight: 900; color: #000; text-transform: uppercase; 
            border-bottom: 3px solid #000; padding-bottom: 10px; letter-spacing: 1px; 
        }

        .print-page { width: 100%; }
        .print-page + .print-page { break-before: page; page-break-before: always; }
        .print-columns-container { display: flex; gap: 10mm; width: 100%; align-items: flex-start; }
        .print-column { width: calc(50% - 5mm); flex-shrink: 0; }

        .print-checklist {
            break-inside: avoid; page-break-inside: avoid;
            border: 2px solid #000; background-color: #fff; color: #000;
            margin-bottom: 16px;
        }
        .print-checklist h3 {
            background: #e0e0e0 !important; -webkit-print-color-adjust: exact;
            color-adjust: exact; print-color-adjust: exact; padding: 6px 10px; margin: 0;
            border-bottom: 2px solid #000; font-size: 14px; color: #000; 
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .print-item { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 5px 10px; border-bottom: 1px solid #ccc; 
            font-size: 13px; color: #000; font-weight: 500;
            break-inside: avoid; page-break-inside: avoid;
        }
        .print-item:last-child { border-bottom: none; }
        
        .print-item-text { flex-shrink: 0; }
        .print-item-leader { flex: 1; border-bottom: 1px dotted #888; margin: 0 8px; position: relative; top: -3px; }
        .print-item-value { flex-shrink: 0; font-weight: 700; }
        
        .print-box { 
            width: 14px; height: 14px; border: 2px solid #000; 
            display: inline-block; flex-shrink: 0; margin-left: 15px; 
        }

        @media print {
            @page { size: A4 portrait; margin: 10mm; }
            body { background-color: #fff !important; color: #000 !important; margin: 0; padding: 0; }
            body > *:not(#print-container) { display: none !important; }
            #print-container { display: block !important; position: static !important; visibility: visible !important; }
        }

        /* =============================================================
           ALTIVIEW · Checklists, on the website look: one phase on screen at a time,
           picked from the phase menu. Theme tokens only (night / day); ":root" + !important
           outranks the older hard-coded rules of cockpit.css.
        ============================================================= */
        :root .content-section { background: var(--canvas) !important; color: var(--text) !important; padding: 28px 36px 64px !important; gap: 22px !important; }
        :root .page-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; border-bottom: 1px solid var(--line) !important; padding-bottom: 20px !important; }
        :root .page-heading h1 { color: var(--text) !important; font-size: 40px !important; }
        :root .page-heading p { color: var(--text-secondary) !important; font-size: 14.5px !important; max-width: 62ch; }
        :root .page-heading-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

        :root .ghost-btn { display: inline-flex; align-items: center; gap: 6px; background: transparent !important; border: 1px solid var(--line-strong) !important; color: var(--text) !important; font-family: var(--f-mono) !important; font-size: 11px !important; font-weight: 600; letter-spacing: .08em !important; text-transform: uppercase; border-radius: 8px !important; padding: 8px 12px; text-decoration: none; cursor: pointer; }
        :root .ghost-btn:hover:not(:disabled) { border-color: var(--cyan) !important; color: var(--cyan) !important; background: var(--cyan-soft) !important; }
        :root .ghost-btn:disabled { opacity: .38; cursor: default; }
        :root .heading-btn { padding: 9px 14px; }
        :root .heading-btn-danger { color: var(--danger) !important; border-color: color-mix(in srgb, var(--danger) 45%, transparent) !important; }
        :root .heading-btn-danger:hover { background: var(--danger-soft) !important; color: var(--danger) !important; border-color: var(--danger) !important; }

        :root .workspace { gap: 22px; }

        /* aircraft list */
        :root .aircraft-panel { width: 270px; background: var(--panel) !important; border: 1px solid var(--line) !important; border-radius: 16px !important; box-shadow: none !important; color: var(--text) !important; }
        :root .panel-title { font-family: var(--f-mono) !important; font-size: 11.5px !important; font-weight: 600 !important; letter-spacing: .16em !important; color: var(--cyan) !important; border-bottom: 1px solid var(--line) !important; padding: 14px 18px !important; }
        :root .aircraft-list li { border-bottom: 1px solid var(--line) !important; border-left: 3px solid transparent !important; color: var(--text) !important; font-size: 14.5px; padding: 13px 16px 13px 15px; }
        :root .aircraft-list li:hover { background: var(--panel-hover) !important; }
        :root .aircraft-list li.active { background: var(--accent-soft) !important; color: var(--text) !important; border-left-color: var(--accent) !important; font-weight: 600; }
        :root .aircraft-list li .count-tag { font-family: var(--f-mono); font-size: 11px; color: var(--text-secondary); opacity: 1; }
        :root .aircraft-list li .remove-btn { color: var(--text-secondary); opacity: 1; }
        :root .add-aircraft-form, :root .data-actions { border: 0 !important; border-top: 1px solid var(--line) !important; border-radius: 0 !important; background: transparent !important; }
        :root .add-aircraft-form input { background: transparent !important; border: 0 !important; border-radius: 0 !important; color: var(--text) !important; padding: 14px 16px !important; font-family: var(--f-body) !important; font-size: 14px !important; box-shadow: none !important; }
        :root .add-aircraft-form button { background: var(--accent) !important; color: var(--on-accent) !important; border: 0 !important; }
        :root .data-actions button { background: transparent !important; color: var(--text-secondary) !important; font-family: var(--f-mono) !important; font-size: 10.5px !important; letter-spacing: .12em; }
        :root .data-actions button:first-child { border-right: 1px solid var(--line) !important; }

        /* phase menu: one tab per checklist, in flight order */

        :root .phase-tab { position: relative; flex: 0 0 auto; display: grid; grid-template-columns: auto auto; grid-template-areas: "num count" "name name"; justify-content: space-between; align-items: center; gap: 3px 16px; min-width: 150px; max-width: 250px; padding: 9px 14px 13px; background: transparent; border: 1px solid transparent; border-radius: 10px; color: var(--text-secondary); text-align: left; cursor: pointer; font: inherit; transition: background-color .15s ease, border-color .15s ease, color .15s ease; }
        :root .phase-tab:hover { background: var(--panel-hover); color: var(--text); }

        /* the checklist on screen */
        :root .checklist-card { background: var(--panel) !important; border: 1px solid var(--line) !important; border-radius: 16px !important; box-shadow: none !important; margin-bottom: 0 !important; color: var(--text) !important; }

                        <input type="text" id="newAircraftInput" placeholder="Nouvel avion (ex. Cessna 172)" maxlength="60" />
                        <button type="submit" title="Ajouter l'avion">+</button>
                    </form>

                    <div class="data-actions">
                        <button type="button" id="btnExportData" title="Télécharger les checklists de l'avion sélectionné">Exporter JSON</button>
                        <button type="button" id="btnImportData" title="Charger des checklists">Importer JSON</button>

    <script>
        const STORAGE_KEY = 'flightprep_checklists_data_v2';

        function loadState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return null;
                const parsed = JSON.parse(raw);
                if (!parsed || !Array.isArray(parsed.aircraft)) return null;
                return parsed;
            } catch (err) {
                console.warn('Could not read saved checklist data:', err);
                return null;
            }
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    aircraft,
                    activeAircraftId,
                    expandedIds: Array.from(expandedChecklistIds),
                    selectedChecklist: selectedChecklistByAircraft
                }));
            } catch (err) {
                console.warn('Could not save checklist data:', err);
            }
        }

        function defaultAircraft() {
            return [{
                id: cryptoRandomId(),
                name: 'Cessna 172',
                checklists: [
                    {
                        id: cryptoRandomId(),
                        title: 'Pre-Flight',
                        items: [
                            { id: cryptoRandomId(), text: 'Fuel quantity and quality', value: 'CHECKED', checked: false },
                            { id: cryptoRandomId(), text: 'Control surfaces', value: 'FREE & CORRECT', checked: false },
                            { id: cryptoRandomId(), text: 'Oil level', value: '6-8 QTS', checked: false }
                        ]
                    },
                    {
                        id: cryptoRandomId(),
                        title: 'Before Takeoff',
                        items: [
                            { id: cryptoRandomId(), text: 'Flaps', value: '10°', checked: false },
                            { id: cryptoRandomId(), text: 'Magnetos', value: 'BOTH', checked: false }
                        ]
                    }
                ]
            }];
        }

        function cryptoRandomId() {
            return 'id-' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
        }

        function moveInArray(arr, fromIndex, toIndex) {
            if (fromIndex === toIndex || fromIndex < 0 || toIndex < 0 || fromIndex >= arr.length || toIndex >= arr.length) return;
            const [item] = arr.splice(fromIndex, 1);
            arr.splice(toIndex, 0, item);
        }

        const saved = loadState();
        let aircraft = saved ? saved.aircraft : defaultAircraft();
        let activeAircraftId = saved && saved.activeAircraftId ? saved.activeAircraftId : (aircraft[0] ? aircraft[0].id : null);
        let expandedChecklistIds = new Set(saved && Array.isArray(saved.expandedIds) ? saved.expandedIds : []);
        // phase shown for each aircraft: the phase menu puts one checklist on screen at a time
        let selectedChecklistByAircraft = saved && saved.selectedChecklist && typeof saved.selectedChecklist === 'object' ? saved.selectedChecklist : {};

        if (!aircraft.find(a => a.id === activeAircraftId)) {
            activeAircraftId = aircraft[0] ? aircraft[0].id : null;
        }

        function getActiveAircraft() {
            return aircraft.find(a => a.id === activeAircraftId) || null;
        }

        function getSelectedChecklist(ac) {
            if (!ac || ac.checklists.length === 0) return null;
            const id = selectedChecklistByAircraft[ac.id];
            return ac.checklists.find(c => c.id === id) || ac.checklists[0];
        }

        function selectChecklist(ac, checklistId) {
            selectedChecklistByAircraft[ac.id] = checklistId;
            saveState();
            renderChecklistsPanel();
        }

        function renderAircraftList() {
            const list = document.getElementById('aircraftList');
            list.innerHTML = '';

            if (aircraft.length === 0) {
                const empty = document.createElement('li');
                empty.className = 'empty-state';
                empty.textContent = 'Aucun avion. Ajoutez-en un ci-dessous.';
                empty.style.cursor = 'default';
                list.appendChild(empty);
                return;
            }

            aircraft.forEach(a => {
                const li = document.createElement('li');
                li.className = a.id === activeAircraftId ? 'active' : '';

                const rowMain = document.createElement('div');
                rowMain.className = 'row-main';

                const nameSpan = document.createElement('span');
                nameSpan.className = 'model-name editable-text';
                nameSpan.title = "Cliquer pour renommer l'avion";
                nameSpan.textContent = a.name;
                
                // Allow renaming Aircraft
                nameSpan.addEventListener('click', (e) => {
                    e.stopPropagation();
                    
                    // Auto-select aircraft if not selected before renaming
                    if (activeAircraftId !== a.id) {
                        activeAircraftId = a.id;
                        expandedChecklistIds.clear(); 
                        saveState();
                        renderAircraftList();
                        renderChecklistsPanel();
                    }

                    // A slight timeout ensures the UI selection changes before the prompt blocks execution
                    setTimeout(() => {
                        const newName = prompt("Renommer l'avion :", a.name);
                        if (newName !== null && newName.trim() !== '') {
                            a.name = newName.trim();
                            saveState();
                            renderAircraftList();
                            renderChecklistsPanel();
                        }
                    }, 10);
                });

                const countTag = document.createElement('span');
                countTag.className = 'count-tag';
                countTag.textContent = `(${a.checklists.length})`;

                rowMain.appendChild(nameSpan);
                rowMain.appendChild(countTag);

                const removeBtn = document.createElement('button');
                removeBtn.className = 'remove-btn';
                removeBtn.title = "Supprimer l'avion";
                removeBtn.textContent = '✕';
                removeBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (!confirm(`Supprimer « ${a.name} » et toutes ses checklists ?`)) return;
                    removeAircraft(a.id);
                });

                li.appendChild(rowMain);
                li.appendChild(removeBtn);
                li.addEventListener('click', () => {
                    if (activeAircraftId === a.id) return;
                    activeAircraftId = a.id;
                    expandedChecklistIds.clear(); 
                    saveState();
                    renderAircraftList();
                    renderChecklistsPanel();
                });
                list.appendChild(li);
            });
        }

        function renderChecklistsPanel() {
            const panel = document.getElementById('checklistsPanel');
            const prevMenu = panel.querySelector('.phase-menu');
            const prevMenuScroll = prevMenu ? prevMenu.scrollLeft : 0;
            panel.innerHTML = '';
            const activeAircraft = getActiveAircraft();

            if (!activeAircraft) {
                const empty = document.createElement('div');
                empty.className = 'no-aircraft-selected';
                empty.textContent = 'Sélectionnez ou ajoutez un avion pour gérer ses checklists.';
                panel.appendChild(empty);
                return;
            }

            const count = activeAircraft.checklists.length;
            const header = document.createElement('div');
            header.className = 'checklists-panel-header';

            const headerLeft = document.createElement('div');
            const h2 = document.createElement('h2');
            h2.textContent = activeAircraft.name;
            const sub = document.createElement('div');
            sub.className = 'sub';
            sub.textContent = `${count} checklist${count > 1 ? 's' : ''} · glissez les onglets pour changer l'ordre du vol`;
            headerLeft.appendChild(h2);
            headerLeft.appendChild(sub);

            const newChecklistForm = document.createElement('form');
            newChecklistForm.className = 'new-checklist-form';
            newChecklistForm.innerHTML = `
                <input type="text" placeholder="Nouvelle checklist (ex. Roulage)" maxlength="50" required />
                <button type="submit">Ajouter</button>
            `;
            newChecklistForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const input = newChecklistForm.querySelector('input');
                const title = input.value.trim();
                if (!title) return;
                const newChecklist = { id: cryptoRandomId(), title, items: [] };
                activeAircraft.checklists.push(newChecklist);
                selectedChecklistByAircraft[activeAircraft.id] = newChecklist.id;
                input.value = '';
                saveState();
                renderAircraftList();
                renderChecklistsPanel();
            });

            header.appendChild(headerLeft);
            header.appendChild(newChecklistForm);
            panel.appendChild(header);

            if (count === 0) {
                const empty = document.createElement('div');
                empty.className = 'no-aircraft-selected';
                empty.textContent = 'Aucune checklist pour cet avion. Ajoutez-en une ci-dessus.';
                panel.appendChild(empty);
                return;
            }

            const current = getSelectedChecklist(activeAircraft);
            const currentIndex = activeAircraft.checklists.indexOf(current);

            // Phase menu: one tab per checklist, in flight order. Click to show it, drag to reorder.
            const menu = document.createElement('div');
            menu.className = 'phase-menu';
            menu.setAttribute('role', 'tablist');
            menu.setAttribute('aria-label', `Checklists · ${activeAircraft.name}`);
            activeAircraft.checklists.forEach((c, i) => {
                const done = c.items.filter(it => it.checked).length;
                const total = c.items.length;
                const complete = total > 0 && done === total;
                const tab = document.createElement('button');
                tab.type = 'button';
                tab.className = 'phase-tab' + (c === current ? ' active' : '') + (complete ? ' done' : '');
                tab.setAttribute('role', 'tab');
                tab.setAttribute('aria-selected', c === current ? 'true' : 'false');
                tab.title = `${c.title} · glisser pour réordonner`;
                tab.draggable = true;
                tab.innerHTML = `<span class="phase-tab-num">${String(i + 1).padStart(2, '0')}</span><span class="phase-tab-count">${complete ? '✓ ' : ''}${done}/${total}</span><span class="phase-tab-name"></span><span class="phase-tab-bar"><i style="width:${total ? Math.round(done / total * 100) : 0}%"></i></span>`;
                tab.querySelector('.phase-tab-name').textContent = c.title;
                tab.addEventListener('click', () => selectChecklist(activeAircraft, c.id));

                tab.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', c.id);
                    e.dataTransfer.effectAllowed = 'move';
                    tab.classList.add('dragging');
                });
                tab.addEventListener('dragend', () => tab.classList.remove('dragging'));
                tab.addEventListener('dragover', (e) => {
                    if (!e.dataTransfer.types.includes('text/plain')) return;
                    e.preventDefault();
                    tab.classList.add('drag-over');
                });
                tab.addEventListener('dragleave', () => tab.classList.remove('drag-over'));
                tab.addEventListener('drop', (e) => {
                    e.preventDefault();
                    tab.classList.remove('drag-over');
                    const fromId = e.dataTransfer.getData('text/plain');
                    if (!fromId || fromId === c.id) return;
                    moveInArray(activeAircraft.checklists, activeAircraft.checklists.findIndex(x => x.id === fromId), i);
                    saveState();
                    renderChecklistsPanel();
                });
                menu.appendChild(tab);
            });
            panel.appendChild(menu);

            // keep the tab strip where it was, with the active tab in view
            menu.scrollLeft = prevMenuScroll;
            const activeTab = menu.querySelector('.phase-tab.active');
            if (activeTab) {
                const left = activeTab.offsetLeft, right = left + activeTab.offsetWidth;
                if (left < menu.scrollLeft) menu.scrollLeft = left - 6;
                else if (right > menu.scrollLeft + menu.clientWidth) menu.scrollLeft = right - menu.clientWidth + 6;
            }

            const toolbar = document.createElement('div');
            toolbar.className = 'flow-toolbar';
            const hint = document.createElement('div');
            hint.className = 'flow-hint';
            hint.textContent = `Phase ${currentIndex + 1} sur ${count} · flèches ← → du clavier pour changer`;
            toolbar.appendChild(hint);

            const actions = document.createElement('div');
            actions.className = 'flow-actions';

            const prevBtn = document.createElement('button');
            prevBtn.type = 'button';
            prevBtn.className = 'ghost-btn';
            prevBtn.textContent = '← Précédente';
            prevBtn.disabled = currentIndex === 0;
            prevBtn.addEventListener('click', () => selectChecklist(activeAircraft, activeAircraft.checklists[currentIndex - 1].id));

            const nextBtn = document.createElement('button');
            nextBtn.type = 'button';
            nextBtn.className = 'ghost-btn';
            nextBtn.textContent = 'Suivante →';
            nextBtn.disabled = currentIndex === count - 1;
            nextBtn.addEventListener('click', () => selectChecklist(activeAircraft, activeAircraft.checklists[currentIndex + 1].id));

            const resetBtn = document.createElement('button');
            resetBtn.type = 'button';
            resetBtn.className = 'ghost-btn';
            resetBtn.textContent = '↺ Tout décocher';
            resetBtn.title = 'Décocher tous les éléments de cette checklist';
            resetBtn.disabled = !current.items.some(i => i.checked);
            resetBtn.addEventListener('click', () => {
                current.items.forEach(i => { i.checked = false; });
                saveState();
                renderChecklistsPanel();
            });

            const exportBtn = document.createElement('button');
            exportBtn.type = 'button';
            exportBtn.className = 'ghost-btn';
            exportBtn.textContent = 'Exporter PDF';
            exportBtn.title = 'Toutes les checklists de cet avion, en kneeboard A4';
            exportBtn.addEventListener('click', () => generatePDF(activeAircraft));

            actions.append(prevBtn, nextBtn, resetBtn, exportBtn);
            toolbar.appendChild(actions);
            panel.appendChild(toolbar);

            panel.appendChild(renderChecklistCard(activeAircraft, current, currentIndex));
        }

        function renderChecklistCard(aircraftObj, checklist, index) {
            const card = document.createElement('div');
            card.className = 'checklist-card';
            card.dataset.checklistId = checklist.id;

            const checkedCount = checklist.items.filter(i => i.checked).length;
            const total = checklist.items.length;
            const complete = total > 0 && checkedCount === total;

            const cardHeader = document.createElement('div');
            cardHeader.className = 'checklist-card-header';

            const phase = document.createElement('span');
            phase.className = 'phase-index';
            phase.textContent = String(index + 1).padStart(2, '0');

            const title = document.createElement('h3');
            title.className = 'editable-text';
            title.title = 'Cliquer pour renommer la checklist';
            title.textContent = checklist.title;

            // Allow renaming Checklist titles
            title.addEventListener('click', (e) => {
                e.stopPropagation();
                const newTitle = prompt('Renommer la checklist :', checklist.title);
                if (newTitle !== null && newTitle.trim() !== '') {
                    checklist.title = newTitle.trim();
                    saveState();
                    renderChecklistsPanel();
                }
            });

            const progress = document.createElement('span');
            progress.className = 'progress-tag' + (complete ? ' done' : '');
            progress.textContent = `${checkedCount}/${total}`;

            const actions = document.createElement('div');
            actions.className = 'header-actions';

            const upBtn = document.createElement('button');
            upBtn.type = 'button';
            upBtn.className = 'icon-btn';
            upBtn.title = 'Placer plus tôt dans le vol';
            upBtn.textContent = '←';
            upBtn.disabled = index === 0;
            upBtn.addEventListener('click', () => {
                moveInArray(aircraftObj.checklists, index, index - 1);
                saveState();
                renderChecklistsPanel();
            });

            const downBtn = document.createElement('button');
            downBtn.type = 'button';
            downBtn.className = 'icon-btn';
            downBtn.title = 'Placer plus tard dans le vol';
            downBtn.textContent = '→';
            downBtn.disabled = index === aircraftObj.checklists.length - 1;
            downBtn.addEventListener('click', () => {
                moveInArray(aircraftObj.checklists, index, index + 1);
                saveState();
                renderChecklistsPanel();
            });

            const removeBtn = document.createElement('button');
            removeBtn.type = 'button';
            removeBtn.className = 'icon-btn danger';
            removeBtn.title = 'Supprimer la checklist';
            removeBtn.textContent = '✕';
            removeBtn.addEventListener('click', () => {
                if (!confirm(`Supprimer la checklist « ${checklist.title} » ?`)) return;
                aircraftObj.checklists = aircraftObj.checklists.filter(c => c.id !== checklist.id);
                expandedChecklistIds.delete(checklist.id);
                const neighbour = aircraftObj.checklists[Math.max(0, index - 1)];
                if (neighbour) selectedChecklistByAircraft[aircraftObj.id] = neighbour.id;
                else delete selectedChecklistByAircraft[aircraftObj.id];
                saveState();
                renderAircraftList();
                renderChecklistsPanel();
            });

            actions.append(upBtn, downBtn, removeBtn);
            cardHeader.append(phase, title, progress, actions);
            card.appendChild(cardHeader);

            const bar = document.createElement('div');
            bar.className = 'checklist-progress' + (complete ? ' done' : '');
            bar.innerHTML = `<i style="width:${total ? Math.round(checkedCount / total * 100) : 0}%"></i>`;
            card.appendChild(bar);

            const body = document.createElement('div');
            body.className = 'checklist-body';

            const itemsList = document.createElement('ul');
            itemsList.className = 'checklist-items';

            if (checklist.items.length === 0) {
                const noItems = document.createElement('li');
                noItems.className = 'no-items';
                noItems.textContent = 'Aucun élément. Ajoutez la première action ci-dessous.';
                itemsList.appendChild(noItems);
            } else {
                checklist.items.forEach((item, itemIndex) => {
                    const li = document.createElement('li');
                    li.className = item.checked ? 'checked' : '';
                    li.dataset.itemId = item.id;

                    const itemHandle = document.createElement('span');
                    itemHandle.className = 'item-handle';
                    itemHandle.title = 'Glisser pour déplacer';
                    itemHandle.draggable = true;
                    itemHandle.textContent = '⠿';
                    itemHandle.addEventListener('dragstart', (e) => {
                        e.stopPropagation();
                        e.dataTransfer.setData('text/item', item.id);
                        e.dataTransfer.effectAllowed = 'move';
                        li.classList.add('item-dragging');
                    });
                    itemHandle.addEventListener('dragend', () => li.classList.remove('item-dragging'));

                    li.addEventListener('dragover', (e) => {
                        if (!e.dataTransfer.types.includes('text/item')) return;
                        e.preventDefault();
                        e.stopPropagation();
                        li.classList.add('item-drag-over');
                    });
                    li.addEventListener('dragleave', () => li.classList.remove('item-drag-over'));
                    li.addEventListener('drop', (e) => {
                        if (!e.dataTransfer.types.includes('text/item')) return;
                        e.preventDefault();
                        e.stopPropagation();
                        li.classList.remove('item-drag-over');
                        const fromId = e.dataTransfer.getData('text/item');
                        if (!fromId || fromId === item.id) return;
                        const fromIndex = checklist.items.findIndex(i => i.id === fromId);
                        const toIndex = checklist.items.findIndex(i => i.id === item.id);
                        moveInArray(checklist.items, fromIndex, toIndex);
                        saveState();
                        renderChecklistsPanel();
                    });

                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.checked = item.checked;
                    checkbox.addEventListener('change', () => {
                        item.checked = checkbox.checked;
                        saveState();
                        renderChecklistsPanel();
                    });

                    const textSpan = document.createElement('span');
                    textSpan.className = 'item-text editable-text';
                    textSpan.title = "Cliquer pour modifier l'action";
                    textSpan.textContent = item.text;
                    
                    // Allow renaming Checklist Item Text
                    textSpan.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const newText = prompt("Modifier l'action :", item.text);
                        if (newText !== null && newText.trim() !== '') {
                            item.text = newText.trim();
                            saveState();
                            renderChecklistsPanel();
                        }
                    });
                    
                    let leaderSpan = null;
                    let valSpan = null;
                    
                    if (item.value) {
                        leaderSpan = document.createElement('span');
                        leaderSpan.className = 'item-leader';
                        
                        valSpan = document.createElement('span');
                        valSpan.className = 'item-value editable-text';
                        valSpan.title = 'Cliquer pour modifier la position';
                        valSpan.textContent = item.value;
                        
                        // Allow renaming Checklist Item Value
                        valSpan.addEventListener('click', (e) => {
                            e.stopPropagation();
                            const newVal = prompt('Modifier la position (vide pour la retirer) :', item.value);
                            if (newVal !== null) {
                                item.value = newVal.trim();
                                saveState();
                                renderChecklistsPanel();
                            }
                        });
                    } else {
                        // Expand text to fill space if no value is present
                        textSpan.style.flex = "1";
                    }

                    const itemUp = document.createElement('button');
                    itemUp.type = 'button';
                    itemUp.className = 'item-move-btn';
                    itemUp.title = 'Monter';
                    itemUp.textContent = '↑';
                    itemUp.disabled = itemIndex === 0;
                    itemUp.addEventListener('click', () => {
                        moveInArray(checklist.items, itemIndex, itemIndex - 1);
                        saveState();
                        renderChecklistsPanel();
                    });

                    const itemDown = document.createElement('button');
                    itemDown.type = 'button';
                    itemDown.className = 'item-move-btn';
                    itemDown.title = 'Descendre';
                    itemDown.textContent = '↓';
                    itemDown.disabled = itemIndex === checklist.items.length - 1;
                    itemDown.addEventListener('click', () => {
                        moveInArray(checklist.items, itemIndex, itemIndex + 1);
                        saveState();
                        renderChecklistsPanel();
                    });

                    const removeItemBtn = document.createElement('button');
                    removeItemBtn.className = 'remove-item-btn';
                    removeItemBtn.title = 'Supprimer';
                    removeItemBtn.textContent = '✕';
                    removeItemBtn.addEventListener('click', () => {
                        checklist.items = checklist.items.filter(i => i.id !== item.id);
                        saveState();
                        renderChecklistsPanel();
                    });

                    li.appendChild(itemHandle);
                    li.appendChild(checkbox);
                    li.appendChild(textSpan);
                    if (leaderSpan && valSpan) {
                        li.appendChild(leaderSpan);
                        li.appendChild(valSpan);
                    }
                    li.appendChild(itemUp);
                    li.appendChild(itemDown);
                    li.appendChild(removeItemBtn);
                    itemsList.appendChild(li);
                });
            }

            const addItemForm = document.createElement('form');
            addItemForm.className = 'add-item-form';
            addItemForm.innerHTML = `
                <input type="text" class="name-input" name="itemName" placeholder="Ajouter une action (ex. Volets)…" maxlength="120" required />
                <input type="text" class="val-input" name="itemValue" placeholder="Position (ex. 10°)…" maxlength="50" />
                <button type="submit" title="Ajouter">+</button>
            `;
            addItemForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const nameInput = addItemForm.querySelector('input[name="itemName"]');
                const valInput = addItemForm.querySelector('input[name="itemValue"]');
                const text = nameInput.value.trim();
                const value = valInput.value.trim();
                
                if (!text) return;
                checklist.items.push({ id: cryptoRandomId(), text, value, checked: false });
                
                nameInput.value = '';
                valInput.value = '';
                nameInput.focus();
                
                saveState();
                renderChecklistsPanel();
            });

            body.append(itemsList, addItemForm);
            card.appendChild(body);

            // Phase complete: offer the next one in flight order straight away
            if (complete) {
                const doneBar = document.createElement('div');
                doneBar.className = 'checklist-complete';
                const msg = document.createElement('span');
                msg.textContent = '✓ Checklist terminée';
                doneBar.appendChild(msg);
                const next = aircraftObj.checklists[index + 1];
                if (next) {
                    const go = document.createElement('button');
                    go.type = 'button';
                    go.className = 'btn-next-phase';
                    go.textContent = `Suivante : ${next.title} →`;
                    go.addEventListener('click', () => selectChecklist(aircraftObj, next.id));
                    doneBar.appendChild(go);
                }
                card.appendChild(doneBar);
            }
            return card;
        }

        function removeAircraft(id) {
            aircraft = aircraft.filter(a => a.id !== id);
            if (activeAircraftId === id) {
                activeAircraftId = aircraft[0] ? aircraft[0].id : null;
            }
            saveState();
            renderAircraftList();
            renderChecklistsPanel();
        }

        document.getElementById('addAircraftForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const input = document.getElementById('newAircraftInput');
            const name = input.value.trim();
            if (!name) return;
            const newAircraft = { id: cryptoRandomId(), name, checklists: [] };
            aircraft.push(newAircraft);
            activeAircraftId = newAircraft.id;
            input.value = '';
            saveState();
            renderAircraftList();
            renderChecklistsPanel();
        });
        
        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
        
        function buildChecklistNode(list, idx) {
            const listDiv = document.createElement('div');
            listDiv.className = 'print-checklist';

            const h3 = document.createElement('h3');
            h3.textContent = String(idx + 1).padStart(2, '0') + '. ' + list.title;
            listDiv.appendChild(h3);

            if (list.items.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'print-item';
                empty.textContent = 'Aucun élément';
                listDiv.appendChild(empty);
            } else {
                list.items.forEach(item => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'print-item';

                    let innerHtml = `<span class="print-item-text">${escapeHtml(item.text)}</span>`;
                    if (item.value) {
                        innerHtml += `<span class="print-item-leader"></span><span class="print-item-value">${escapeHtml(item.value)}</span>`;
                    } else {
                        innerHtml += `<span style="flex: 1;"></span>`;
                    }

                    innerHtml += `<div class="print-box"></div>`;
                    itemDiv.innerHTML = innerHtml;
                    listDiv.appendChild(itemDiv);
                });
            }

            return listDiv;
        }

        const PX_PER_MM = 96 / 25.4;
        const PAGE_HEIGHT_MM = 297;
        const PAGE_WIDTH_MM = 210;
        const PAGE_MARGIN_MM = 10;
        const COLUMN_GAP_MM = 10;
        const CHECKLIST_MARGIN_BOTTOM_PX = 16; 

        function mmToPx(mm) { return mm * PX_PER_MM; }

        async function generatePDF(aircraft) {
            let oldContainer = document.getElementById('print-container');
            if (oldContainer) oldContainer.remove();

            const container = document.createElement('div');
            container.id = 'print-container';

            const title = document.createElement('div');
            title.className = 'print-header';
            title.textContent = aircraft.name + ' · Checklists';
            container.appendChild(title);

            const usableWidthPx = mmToPx(PAGE_WIDTH_MM - 2 * PAGE_MARGIN_MM);
            const columnWidthPx = (usableWidthPx - mmToPx(COLUMN_GAP_MM)) / 2;
            const usableHeightPx = mmToPx(PAGE_HEIGHT_MM - 2 * PAGE_MARGIN_MM);

            document.body.appendChild(container);
            container.classList.add('print-measuring');
            container.style.width = mmToPx(PAGE_WIDTH_MM - 2 * PAGE_MARGIN_MM) + 'px';

            const measureWrap = document.createElement('div');
            measureWrap.style.width = columnWidthPx + 'px';
            container.appendChild(measureWrap);

            const nodes = aircraft.checklists.map((list, idx) => buildChecklistNode(list, idx));
            nodes.forEach(n => measureWrap.appendChild(n));

            if (document.fonts && document.fonts.ready) {
                try { await document.fonts.ready; } catch (e) { /* ignore */ }
            }

            const headerHeightPx = title.getBoundingClientRect().height
                + parseFloat(getComputedStyle(title).marginBottom || '0');

            const heights = nodes.map(n => n.getBoundingClientRect().height + CHECKLIST_MARGIN_BOTTOM_PX);

            measureWrap.remove();
            container.classList.remove('print-measuring');
            container.removeAttribute('style');

            const pages = [];
            let page = { left: [], right: [], leftH: 0, rightH: 0, budget: usableHeightPx - headerHeightPx };
            pages.push(page);

            nodes.forEach((node, i) => {
                const h = heights[i];
                if (page.leftH + h <= page.budget) {
                    page.left.push(node);
                    page.leftH += h;
                } else if (page.rightH + h <= page.budget) {
                    page.right.push(node);
                    page.rightH += h;
                } else {
                    page = { left: [node], right: [], leftH: h, rightH: 0, budget: usableHeightPx };
                    pages.push(page);
                }
            });

            pages.forEach((p, pageIdx) => {
                const pageDiv = document.createElement('div');
                pageDiv.className = 'print-page';

                const columnsContainer = document.createElement('div');
                columnsContainer.className = 'print-columns-container';

                const leftCol = document.createElement('div');
                leftCol.className = 'print-column';
                p.left.forEach(n => leftCol.appendChild(n));

                const rightCol = document.createElement('div');
                rightCol.className = 'print-column';
                p.right.forEach(n => rightCol.appendChild(n));

                columnsContainer.appendChild(leftCol);
                columnsContainer.appendChild(rightCol);
                pageDiv.appendChild(columnsContainer);
                container.appendChild(pageDiv);
            });

            setTimeout(() => {
                window.print();
                const pc = document.getElementById('print-container');
                if (pc) pc.remove();
            }, 150);
        }

        document.getElementById('btnExportData').addEventListener('click', () => {
            const activeAc = getActiveAircraft();
            if (!activeAc) {
                alert("Aucun avion sélectionné à exporter.");
                return;
            }
            
            const dataStr = JSON.stringify([activeAc], null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            
            const safeName = activeAc.name.replace(/[^a-z0-9]/gi, '_').toLowerCase();
            a.download = `flightprep_${safeName}_${new Date().toISOString().split('T')[0]}.json`;
            
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        const btnImportData = document.getElementById('btnImportData');
        const fileImport = document.getElementById('fileImport');

        btnImportData.addEventListener('click', () => {
            fileImport.click();
        });

        fileImport.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const importedData = JSON.parse(event.target.result);
                    
                    if (!Array.isArray(importedData)) {
                        throw new Error("format invalide, liste d'avions attendue.");
                    }
                    
                    const validAircraft = importedData.filter(a => a.id && a.name && Array.isArray(a.checklists));
                    if (validAircraft.length === 0) {
                        throw new Error("aucun avion valide dans ce fichier.");
                    }

                    let firstNewId = null;

                    validAircraft.forEach((a, index) => {
                        const newAcId = cryptoRandomId();
                        if (index === 0) firstNewId = newAcId;
                        
                        const newChecklists = a.checklists.map(c => ({
                            ...c,
                            id: cryptoRandomId(),
                            items: c.items.map(i => ({
                                ...i, 
                                id: cryptoRandomId(),
                                value: i.value || '' 
                            }))
                        }));
                        aircraft.push({ ...a, id: newAcId, checklists: newChecklists });
                    });

                    if (firstNewId) {
                        activeAircraftId = firstNewId;
                        expandedChecklistIds.clear();
                    }

                    saveState();
                    renderAircraftList();
                    renderChecklistsPanel();
                    
                } catch (err) {
                    alert("Échec de l'import : " + err.message);
                }
                
                fileImport.value = '';
            };
            reader.readAsText(file);
        });

        // Theme synchronization handled globally by CockpitNav

        renderAircraftList();
        renderChecklistsPanel();

        // ← / → : previous / next phase (ignored while typing in a field)
        document.addEventListener('keydown', (e) => {
            if ((e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') || e.altKey || e.ctrlKey || e.metaKey) return;
            const el = document.activeElement;
            if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || el.isContentEditable)) return;
            const ac = getActiveAircraft();
            const current = getSelectedChecklist(ac);
            if (!current) return;
            const target = ac.checklists[ac.checklists.indexOf(current) + (e.key === 'ArrowRight' ? 1 : -1)];
            if (!target) return;
            e.preventDefault();
            selectChecklist(ac, target.id);
        });

        function reloadFromStorage() {
            const state = loadState();
            if (state) {
                aircraft = state.aircraft;
                activeAircraftId = state.activeAircraftId || (aircraft[0] ? aircraft[0].id : null);
                expandedChecklistIds = new Set(Array.isArray(state.expandedIds) ? state.expandedIds : []);
                selectedChecklistByAircraft = state.selectedChecklist && typeof state.selectedChecklist === 'object' ? state.selectedChecklist : {};
                renderAircraftList();
                renderChecklistsPanel();
            }
        }

        window.__hasProfileChangeHandler = true;
        window.addEventListener('aircraftProfileChanged', reloadFromStorage);
        window.addEventListener('storage', (e) => {
            if (e.key === STORAGE_KEY || e.key === 'flightprep_profile_sync_trigger') {
                reloadFromStorage();
            }
        });
    </script>
